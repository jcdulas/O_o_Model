[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "oo-model"
version = "0.2.3"
description = "Build, edit and query finite element models in memory. Native Python interface to the O_o C++ library, also available for JavaScript/WebAssembly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.urls]
Documentation = "https://jcdulas.github.io/O_o_Model/"
Repository = "https://github.com/jcdulas/O_o_Model"

[tool.scikit-build]
minimum-version = "0.11"
wheel.packages = ["python/oo_model"]
build-dir = "build/python/{wheel_tag}"
build.targets = ["_native"]

[tool.scikit-build.cmake.define]
OOR_BUILD_PYTHON = "ON"
OOR_BUILD_TESTS = "OFF"
