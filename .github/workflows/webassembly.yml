name: WebAssembly

# Builds the WebAssembly package (single-threaded, 64-bit WebAssembly), runs its tests, archives build/wasm/dist and,
# on the main branch, publishes it as the release that follows the branch and as the release kept for its version.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'formats/**'
      - 'wasm/src/**'
      - 'wasm/js/**'
      - 'wasm/test/**'
      - 'wasm/CMakeLists.txt'
      - 'wasm/package.json'
      - 'scripts/build_wasm.sh'
      - 'scripts/build_hdf5_wasm.sh'
      - 'CMakeLists.txt'
      - '!**/*.md'
      # A tag targeting older workflow files may require extra permissions. Supersede that build on main.
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'formats/**'
      - 'wasm/src/**'
      - 'wasm/js/**'
      - 'wasm/test/**'
      - 'wasm/CMakeLists.txt'
      - 'wasm/package.json'
      - 'scripts/build_wasm.sh'
      - 'scripts/build_hdf5_wasm.sh'
      - 'CMakeLists.txt'
      - '!**/*.md'
      - '.github/workflows/webassembly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webassembly-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version of the Emscripten SDK the package and its libhdf5 are built with.
  EMSCRIPTEN_VERSION: '6.0.13'

jobs:
  package:
    name: Build the WebAssembly package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Restore libhdf5
        # The library changes only with its build script and with the SDK.
        id: hdf5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasm-deps/hdf5-wasm64
          key: hdf5-wasm64-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('scripts/build_hdf5_wasm.sh') }}
      - name: Build libhdf5
        if: steps.hdf5.outputs.cache-hit != 'true'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/build_hdf5_wasm.sh "$RUNNER_TEMP/wasm-deps"
      - name: Build the package
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/build_wasm.sh "$RUNNER_TEMP/wasm-deps"
      - name: Run the tests
        # The module needs 64-bit WebAssembly: the Node.js of the SDK runs it.
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          "${EMSDK_NODE:-node}" --test wasm/test/*.test.mjs
      - name: Archive the package
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: O_o_Model-wasm
          path: build/wasm/dist/
          if-no-files-found: error
          retention-days: 90
      - name: Add download instructions
        env:
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
        run: |
          echo '## WebAssembly package' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the package]($ARTIFACT_URL) built from commit \`$GITHUB_SHA\` with Emscripten $EMSCRIPTEN_VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the archive and import index.js; the module needs a runtime with 64-bit WebAssembly (Node.js 24 or later).' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the package as releases
    # Two kinds of release. One follows the main branch (wasm-latest, a pre-release): its tag moves to the commit built
    # and its archive is replaced. One is kept for each version of wasm/package.json (v0.2.1, ...): it is made by the
    # first build of that version and never changed afterwards, and the newest is the latest release of the repository.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: webassembly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_TAG: wasm-latest
      BRANCH_TITLE: WebAssembly package of the main branch
      ARCHIVE: O_o_Model-wasm.zip
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: O_o_Model-wasm
          path: package
      - name: Make the archive and its notes
        run: |
          (cd package && zip --recurse-paths "../$ARCHIVE" .)
          VERSION="$(jq --raw-output '.version // empty' package/package.json)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          {
            echo "Version $VERSION of the package, built from commit $GITHUB_SHA with Emscripten $EMSCRIPTEN_VERSION:"
            echo "single-threaded."
            echo
            echo "Extract $ARCHIVE and import index.js; the module needs a runtime with 64-bit WebAssembly"
            echo "(Node.js 24 or later, or a browser that supports it). The tests of the package have passed on"
            echo "this build."
          } > notes.md
          {
            echo "The latest build of the main branch, replaced at every change of its sources."
            echo
            cat notes.md
          } > branch-notes.md
      - name: Publish the build of the main branch
        run: |
          if gh release view "$BRANCH_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$BRANCH_TAG" \
              --raw-field sha="$GITHUB_SHA" --field force=true > /dev/null
            gh release upload "$BRANCH_TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$BRANCH_TAG" --title "$BRANCH_TITLE" --notes-file branch-notes.md --prerelease \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$BRANCH_TAG" "$ARCHIVE" --target "$GITHUB_SHA" --title "$BRANCH_TITLE" \
              --notes-file branch-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
          fi
          echo '## Releases' >> "$GITHUB_STEP_SUMMARY"
          echo "[$ARCHIVE of the main branch]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BRANCH_TAG/$ARCHIVE) is published." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the release of a new version
        run: |
          VERSION_TAG="v$VERSION"
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Version $VERSION has its release, kept as it is." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$VERSION_TAG" "$ARCHIVE" --target "$GITHUB_SHA" --title "Version $VERSION" \
              --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY"
            echo "[$ARCHIVE of version $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION_TAG/$ARCHIVE) is published and kept." >> "$GITHUB_STEP_SUMMARY"
          fi
