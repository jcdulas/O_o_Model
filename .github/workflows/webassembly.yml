name: WebAssembly

# Builds the WebAssembly package (single-threaded, 64-bit WebAssembly), runs its tests, archives build/wasm/dist and,
# on the main branch, publishes it as the release that follows the branch.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'formats/**'
      - 'wasm/src/**'
      - 'wasm/js/**'
      - 'wasm/test/**'
      - 'wasm/CMakeLists.txt'
      - 'wasm/package.json'
      - 'scripts/build_wasm.sh'
      - 'scripts/build_hdf5_wasm.sh'
      - 'CMakeLists.txt'
      - '!**/*.md'
      - '.github/workflows/webassembly.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'formats/**'
      - 'wasm/src/**'
      - 'wasm/js/**'
      - 'wasm/test/**'
      - 'wasm/CMakeLists.txt'
      - 'wasm/package.json'
      - 'scripts/build_wasm.sh'
      - 'scripts/build_hdf5_wasm.sh'
      - 'CMakeLists.txt'
      - '!**/*.md'
      - '.github/workflows/webassembly.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webassembly-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version of the Emscripten SDK the package and its libhdf5 are built with.
  EMSCRIPTEN_VERSION: '6.0.13'

jobs:
  package:
    name: Build the WebAssembly package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Restore libhdf5
        # The library changes only with its build script and with the SDK.
        id: hdf5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasm-deps/hdf5-wasm64
          key: hdf5-wasm64-emscripten-${{ env.EMSCRIPTEN_VERSION }}-${{ hashFiles('scripts/build_hdf5_wasm.sh') }}
      - name: Build libhdf5
        if: steps.hdf5.outputs.cache-hit != 'true'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/build_hdf5_wasm.sh "$RUNNER_TEMP/wasm-deps"
      - name: Build the package
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          bash scripts/build_wasm.sh "$RUNNER_TEMP/wasm-deps"
      - name: Run the tests
        # The module needs 64-bit WebAssembly: the Node.js of the SDK runs it.
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          "${EMSDK_NODE:-node}" --test wasm/test/*.test.mjs
      - name: Archive the package
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: O_o_Reader-wasm
          path: build/wasm/dist/
          if-no-files-found: error
          retention-days: 90
      - name: Add download instructions
        env:
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
        run: |
          echo '## WebAssembly package' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download the package]($ARTIFACT_URL) built from commit \`$GITHUB_SHA\` with Emscripten $EMSCRIPTEN_VERSION." >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the archive and import index.js; the module needs a runtime with 64-bit WebAssembly (Node.js 24 or later).' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish the package as a release
    # One release follows the main branch: its tag moves to the commit built and its archive is replaced.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: webassembly-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: wasm-latest
      RELEASE_TITLE: WebAssembly package of the main branch
      ARCHIVE: O_o_Reader-wasm.zip
    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: O_o_Reader-wasm
          path: package
      - name: Make the archive and its notes
        run: |
          (cd package && zip --recurse-paths "../$ARCHIVE" .)
          {
            echo "Built from commit $GITHUB_SHA with Emscripten $EMSCRIPTEN_VERSION: the package, single-threaded."
            echo
            echo "Extract $ARCHIVE and import index.js; the module needs a runtime with 64-bit WebAssembly"
            echo "(Node.js 24 or later, or a browser that supports it). This build is replaced at every change of the"
            echo "sources on the main branch, after the tests of the package have passed."
          } > notes.md
      - name: Publish the release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              --raw-field sha="$GITHUB_SHA" --field force=true > /dev/null
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file notes.md --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
              --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
          echo '## Release' >> "$GITHUB_STEP_SUMMARY"
          echo "[$ARCHIVE]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$ARCHIVE) is published." >> "$GITHUB_STEP_SUMMARY"
